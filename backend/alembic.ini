# Two migration chains (DEC-011). Always name one with -n:
#   alembic -n control upgrade head
#   alembic -n tenant -x schema=tenant_<slug> upgrade head
# Every tenant at once, in order: python -m app.management.migrate --apply

[control]
script_location = alembic/control
prepend_sys_path = .
version_path_separator = os
path_separator = os

[tenant]
script_location = alembic/tenant
prepend_sys_path = .
version_path_separator = os
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
