[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "navalha-core-api"
version = "0.1.0"
description = "Core API do SaaS de barbearias — cadastros, agenda, CRM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# --------------------------------------------------------------------------- #
# Module boundaries (rules.md, "Architecture"). Run with: lint-imports
# A new module adds itself to the `containers` of the layers contract.
# Cross-module "only through public.py" is checked by
# tests/test_contracts/test_module_layout.py.
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core is infrastructure: it imports no module (except the model registry, DEC-008)"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.main", "app.management"]
ignore_imports = ["app.core.model_registry -> app.modules.*.model"]

[[tool.importlinter.contracts]]
name = "inside a module, layers point down: router -> service -> repository -> model"
type = "layers"
containers = ["app.modules.identity", "app.modules.provisioning"]
layers = ["router", "service", "repository", "model"]

[[tool.importlinter.contracts]]
name = "modules never import the composition roots"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.main", "app.management"]
