# Project identity and metadata. Loaded on EVERY interaction — keep it short.

[project]
name = "Navalha · Core API"
version = "0.1.0"
description = "System of record of the barbershop SaaS: multi-tenant (RLS), identity, RBAC; next: catalog, scheduling, customers, finance, conversations"
type = "api"
language = "pt-BR"            # docs, specs and user-facing messages; code identifiers in English

[project.team]
author = "Miguel Albuquerque"
company = "Navalha.app"

[project.urls]
production = "NOT DEPLOYED YET"
staging = "NOT DEPLOYED YET"
local = "http://localhost:8000 (docs at /docs)"
docs = "backend/README.md, backend/docs/, docs/ (repo root)"

[stack]
languages = ["Python 3.12"]
frameworks = ["FastAPI", "SQLAlchemy 2 (async)", "Pydantic 2", "Alembic"]
database = "PostgreSQL 16 with Row-Level Security; Redis 7 (provisioned, not used yet)"
package_manager = "pip (pyproject.toml)"
tooling = ["pytest", "ruff", "import-linter", "Docker Compose", "GitHub Actions"]

[environments]
environment_variables_doc_path = "backend/docs/ENVIRONMENT_VARIABLES.md"
permissions_map_doc_path = "backend/docs/PERMISSIONS_MAP.md"

[sibling]
frontend = "../frontend (React + Vite) — its context layer is frontend/.github/"
