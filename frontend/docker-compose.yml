name: navalha-frontend

# Frontend stack: the Vite dev server, with HMR.
#
#   web  http://localhost:5173
#
# Joins the `navalha` network created by backend/docker-compose.yml, so the dev
# server can proxy /api to the core-api container. Start the backend first.

services:
  web:
    build:
      context: .
      target: dev
    environment:
      # Service name, not localhost: inside the network `localhost` is the web
      # container itself.
      VITE_PROXY_TARGET: http://core-api:8000
      # Windows bind mounts swallow inotify events; without polling the dev
      # server never notices a file change.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    networks: [navalha]
    volumes:
      - .:/app
      # Anonymous volume so the bind mount above does not hide the node_modules
      # installed during the build — they are Linux binaries, and the host copy
      # (Windows) would not run here anyway.
      - /app/node_modules

networks:
  navalha:
    name: navalha
