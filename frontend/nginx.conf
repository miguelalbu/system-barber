server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets never change under the same name — cache them hard.
    # One directive only: `expires` also emits Cache-Control, and combining it
    # with add_header would send the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA owns its routes (/app/agenda, /convite/:token, ...), so any path
    # that is not a real file has to fall back to index.html. Without this, a
    # page reload on a deep link returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, otherwise the browser keeps pointing at
    # asset hashes from a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
