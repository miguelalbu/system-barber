# The same gate as `make check`, one job per project.
# Context for AI agents lives in backend/.github and frontend/.github (DEC-010);
# this root folder only holds what GitHub itself reads.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, boundaries, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: navalha
          POSTGRES_PASSWORD: navalha
          POSTGRES_DB: navalha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U navalha -d navalha"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENVIRONMENT: dev
      # Runtime as the role without DDL, so the suite exercises the real grants (DEC-012).
      DATABASE_URL: postgresql+asyncpg://navalha_app:navalha_app@localhost:5432/navalha
      DATABASE_URL_MIGRATIONS: postgresql+asyncpg://navalha:navalha@localhost:5432/navalha
      JWT_SECRET: ci-only-secret-with-more-than-32-bytes-of-length
      BASE_DOMAIN: navalha.local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check app tests tools
          ruff format --check app tests tools

      - name: Module boundaries
        run: lint-imports

      - name: Create the runtime role
        env:
          ADMIN_URL: postgresql://navalha:navalha@localhost:5432/navalha
        run: |
          # The image answers on the local socket during initdb, before the
          # database exists; over TCP only the final server answers. Wait for it.
          for _ in $(seq 1 30); do psql "$ADMIN_URL" -c 'SELECT 1' >/dev/null 2>&1 && break; sleep 1; done
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f ../infra/postgres/init/01-app-role.sql

      - name: Migrations (control plane + tenant chain on tenant_template)
        run: |
          python -m app.management.migrate --apply --template
          alembic -n control check
          alembic -n tenant -x schema=tenant_template check

      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint, typecheck and tests
        run: npm run check

      - name: Build
        run: npm run build
